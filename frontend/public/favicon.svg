<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NexusQC">
  <title>NexusQC</title>
  <!-- A benzene-shaped tile carrying an N drawn as a three-bond skeletal
       chain: up, diagonal down, up. The hexagon is what says chemistry at a
       glance; the letterform is what makes it ours.

       This is the 16px cut and it deliberately omits the atom nodes that
       src/brand/Logo.tsx draws at 24px and above. Four filled circles inside
       a 16px glyph turn into holes, which is how the earlier ball-and-stick
       favicon failed when it was rendered at tab size.

       The gradient runs cyan to blue along the diagonal because those are two
       real Balmer lines, H-beta at 486 nm and H-gamma at 434 nm, which is
       where the rest of the palette comes from too. It is provenance, not
       decoration. A favicon gets no page CSS, so every colour is explicit
       here, and the tile is bright enough to find on light and dark browser
       chrome alike. -->
  <defs>
    <linearGradient id="nx" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d3ea"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
  </defs>
  <path d="M32 3 58.1 18v30L32 63 5.9 48V18Z" fill="url(#nx)" stroke="url(#nx)"
        stroke-width="5" stroke-linejoin="round"/>
  <path d="M18 48V17l28 31V17" fill="none" stroke="#0d1117" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
