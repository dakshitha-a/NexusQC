# Shared TLS parameters for both listeners in nginx.conf.
#
# Split out for the same reason as proxy_common.conf: the intranet and
# public server blocks must never drift apart on the parts that matter for
# correctness. The certificate paths themselves stay in each server block,
# since those genuinely differ.
#
# TLS 1.2 and 1.3 only. TLS 1.0/1.1 are long deprecated and nginx's own
# default (`ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3`) still enables
# them unless overridden here.
ssl_protocols TLSv1.2 TLSv1.3;

# Let the client's preference win. With TLS 1.3 and modern AEAD-only
# ciphersuites there is no weak option left for a client to be steered
# away from, and client-preferred ordering lets a device pick whatever it
# has hardware acceleration for.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# A shared session cache across workers. Without it every reconnection
# pays a full handshake -- noticeable here because the SPA holds a
# long-lived SSE stream (GET /api/threads/{id}/events) alongside ordinary
# polling, so a browser opens several connections per session.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling is deliberately NOT enabled. The intranet listener uses a
# self-signed certificate (see scripts/gen_intranet_cert.sh) which has no
# OCSP responder to staple from, so turning it on would only produce
# periodic "ssl_stapling ignored, no OCSP responder URL" warnings in the
# error log. Enable it if and when an institutional CA-issued certificate
# replaces the self-signed one.
