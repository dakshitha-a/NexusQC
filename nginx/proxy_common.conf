# Shared proxy directives for both the intranet and public server blocks in
# nginx.conf. Split out rather than duplicated so the two listeners can
# never drift out of sync on the parts that matter for correctness (SSE
# streaming, upstream host header).
proxy_pass http://api_backend;
proxy_http_version 1.1;
# $http_host (the client's literal, unmodified Host header), NOT $host --
# nginx's $host variable always strips the port, even when the client sent
# one. app/auth/middleware.py's AccessControlMiddleware reconstructs this
# deployment's own origin as "{X-Forwarded-Proto}://{Host}" specifically to
# validate a same-origin browser request's Origin header against it -- but
# the intranet listener (nginx/nginx.conf) is permanently bound to a
# non-default port (8443), so a real browser's Origin header always
# includes ":8443" while a portless $host never would, and every real,
# legitimate state-changing request would be rejected as "origin not
# allowed". Confirmed empirically (not just reasoned through): a curl
# POST with a real, matching Origin header still 403'd under the old
# `Host $host` directive, and started working the moment the Origin
# header's port was dropped to match $host's own portless reconstruction
# -- i.e. the deployed origin's own listener could never satisfy its own
# CSRF check. $http_host preserves the port, closing this without touching
# the middleware itself.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Disable nginx's default upstream Connection: close so HTTP/1.1 keep-alive
# to the api backend actually applies -- relevant for SSE specifically.
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 3600s;
chunked_transfer_encoding on;
