# Shared proxy directives for both the intranet and public server blocks in
# nginx.conf. Split out rather than duplicated so the two listeners can
# never drift out of sync on the parts that matter for correctness (SSE
# streaming, upstream host header).
proxy_pass http://api_backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Disable nginx's default upstream Connection: close so HTTP/1.1 keep-alive
# to the api backend actually applies -- relevant for SSE specifically.
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 3600s;
chunked_transfer_encoding on;
