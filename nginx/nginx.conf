# Reverse proxy + static-SPA server for the CASSCF agent deployment.
#
# ONE listener: the intranet one, CIDR-restricted, HTTPS. The auth cookie is
# `Secure`, so an HTTP listener would silently break login on it.
#
# This header used to describe two listeners, a public one alongside the
# intranet one, and a host-level kill switch at
# scripts/toggle_public_access.sh. All three were removed on 2026-08-25 and
# the note at the bottom of this file records it -- but the header was not
# edited at the time, so the top of the file contradicted the bottom of the
# same file and sent readers looking for a script that is not there and
# hostname placeholders that do not appear (R-092).
#
# The CIDR allowlist below is the thing to change for your own network.
# Certs: an internal CA or a self-signed certificate is fine here, which is
# what scripts/gen_intranet_cert.sh produces.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # SSE (GET /api/threads/{id}/events) is long-lived and streams small
    # chunks continuously -- nginx's default buffering would hold those
    # chunks until a buffer fills, defeating the point of server-sent
    # events, and the default 60s proxy_read_timeout would kill an idle-but-
    # alive stream well before server/sse.py's ~15s keepalive comment
    # expects a client to notice a dead connection. Both are set globally
    # under /api/ below rather than only on the /events path, since nothing
    # else under /api/ benefits from response buffering either (job
    # polling/chat-turn POSTs are all small, fast, non-streamed responses).

    upstream api_backend {
        server api:8000;
    }

    server {
        listen 8443 ssl;
        http2 on;
        # Catch-all: this deployment serves one vhost per port, so the real
        # FQDN never needs to appear here. Set it explicitly only if you add
        # a second vhost on the same port. The certificate's own SAN is set
        # separately, from QC_AGENT_CERT_FQDN -- see scripts/gen_intranet_cert.sh.
        server_name _;

        # Source-address allowlist. This is defence in depth, NOT the
        # primary boundary: docker-compose.yml publishes this port on two
        # named interfaces only (the lab LAN and the tailnet), so the
        # host's public address is never bound at all and cannot reach
        # here regardless of what these rules say.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;      # private LAN range
        allow 100.64.0.0/10;      # tailnet CGNAT range
        allow 127.0.0.1;          # host-local checks (see note below)
        deny all;

        # Note on what $remote_addr actually is here: Docker publishes this
        # port with an iptables DNAT rule, which preserves the original
        # source address, so a real LAN or tailnet client is matched on its
        # own IP. The exception is a connection originating on this host
        # itself, which goes through Docker's userland proxy and arrives
        # SNAT'd as the bridge gateway (172.18.0.1) -- already inside the
        # 172.16.0.0/12 rule above. This matters beyond the allowlist:
        # proxy_common.conf derives X-Real-IP from $remote_addr, and
        # app/auth/rate_limit.py keys its per-IP login throttle on that
        # header, so a collapsed source address would put every user into
        # one shared rate-limit bucket -- every user sharing one budget,
        # and one user's failed logins throttling everyone else's. The
        # DNAT behaviour above is how Docker is documented to work, but it
        # has NOT been confirmed against a real remote client on this
        # deployment; docs/DEPLOYMENT.md carries it as an explicit check to
        # run from a second machine. Until then, treat it as expected
        # rather than established.

        ssl_certificate     /etc/nginx/certs/intranet.crt;
        ssl_certificate_key /etc/nginx/certs/intranet.key;

        include /etc/nginx/tls_common.conf;
        include /etc/nginx/security_headers.conf;

        # Uploaded manuals/papers go through POST /api/kb/sources. nginx's
        # 1MB default client_max_body_size would reject any real PDF with a
        # 413 before it ever reached FastAPI, where this app's own storage
        # quotas (app/auth/storage_quota.py) are the intended limit.
        client_max_body_size 512m;

        location /api/ {
            proxy_set_header X-Access-Channel intranet;
            include /etc/nginx/proxy_common.conf;
        }

        # Update progress, readable while the api is being recreated. See the
        # bind mount in docker-compose.yml for why this is not behind auth.
        #
        # Only the per-run subdirectories. The two files that sit beside them
        # at fixed names, runner.json and request.json, are not progress and
        # were never meant to be public; runner.json used to carry the host's
        # repo path, so an unauthenticated GET handed out the operator's
        # username and the filesystem layout (R-008). The regex below matches
        # <run-id>/<file>, which requires a slash, and neither fixed-name file
        # has one. That is a whitelist rather than two deny rules on purpose:
        # a third file added to this directory later is private by default.
        location ~ ^/deploy-status/([A-Za-z0-9_-]+)/([A-Za-z0-9_.-]+)$ {
            alias /usr/share/nginx/deploy-status/$1/$2;
            # Without no-store the browser serves the first status.json it saw
            # forever, and the overlay never notices the update finished.
            add_header Cache-Control "no-store" always;
            # Nothing here should be browsable: the run ids are the only
            # thing keeping one run's log out of a casual reader's way.
            autoindex off;
            default_type application/json;
            # A run that has not written its status yet is "not ready", not an
            # error, and the overlay already treats a failed fetch that way.
            error_page 403 404 = @deploy_status_missing;
        }
        # Anything else under /deploy-status/, including the two fixed-name
        # files, answers the same "not ready" body as a missing run rather
        # than a 403 that would confirm the path exists.
        location /deploy-status/ {
            return 404 '{"state":"unknown"}';
        }
        location @deploy_status_missing {
            return 404 '{"state":"unknown"}';
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;

            # Vite emits content-hashed filenames under /assets/, so those
            # are safe to cache hard. index.html must never be cached: it
            # is the file that names the current hashed bundles, and a
            # stale copy pins every returning browser to a deleted bundle.
            # The re-includes are load-bearing, not redundant -- see the
            # inheritance note at the top of security_headers.conf.
            location /assets/ {
                include /etc/nginx/security_headers.conf;
                expires 1y;
                add_header Cache-Control "public, immutable" always;
            }
            location = /index.html {
                include /etc/nginx/security_headers.conf;
                add_header Cache-Control "no-store" always;
            }
        }
    }

    # The public-internet listener was removed on 2026-08-25. This deployment
    # serves an intranet listener and a tailnet address, and nothing else --
    # see docs/DEPLOYMENT.md. Its port had already been commented out of
    # docker-compose.yml, so the block below it was unreachable, and with it
    # went the only thing that ever set X-Access-Channel: public. Everything
    # built on that header (the admin panel's soft toggle, the middleware
    # check it drove, and scripts/toggle_public_access.sh) went at the same
    # time rather than being left as machinery guarding a door that is no
    # longer in the wall.
    #
    # To serve publicly, this needs restoring together with its port, a real
    # certificate, and a deliberate decision about access control -- git
    # history has the original.
}
