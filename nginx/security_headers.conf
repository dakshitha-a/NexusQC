# Response headers applied to both listeners.
#
# IMPORTANT nginx inheritance rule: `add_header` directives are inherited
# from an enclosing level ONLY when the current level declares no
# `add_header` of its own. Declaring even one add_header inside a nested
# location silently drops every inherited header for responses from that
# location. That is why nginx.conf includes this file again inside the
# nested /assets/ and =/index.html locations, which set their own
# Cache-Control -- without the re-include those responses would ship with
# no security headers at all. Do not "tidy" those duplicate includes away.
#
# `always` is set on each so the header is also emitted on error responses
# (403 from the CIDR allowlist, 502 while the api container is restarting),
# not only on 2xx/3xx.

# This app is never intended to be framed. DENY rather than SAMEORIGIN:
# nothing in the SPA embeds itself.
add_header X-Frame-Options "DENY" always;

# Stop browsers from MIME-sniffing a response into a different content
# type -- relevant here because GET /api/jobs/{id}/artifacts/{key} serves
# user-influenced files (cube files, logs, PNGs) from the app's own origin.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak the in-app URL (which carries thread and job ids) to any
# third-party origin a user might navigate to from a chat message.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS, deliberately at a SHORT max-age while the intranet listener uses a
# self-signed certificate.
#
# A browser ignores an HSTS header received over a connection that had
# certificate errors, so this only ever latches on clients that have
# imported the certificate (see docs/DEPLOYMENT.md). Once latched, a
# certificate problem stops being a warning users can click through and
# becomes a hard, unbypassable failure for the whole max-age -- and every
# foreseeable next step here is exactly such a problem: the certificate
# expiring, a botched swap to an institutional certificate, or a change of
# hostname. Pinning a year of that onto a tool people need to get work done
# is a bad trade while the certificate is still self-managed.
#
# Raise this to 31536000 (one year) once a CA-issued certificate is in
# place and its renewal is automated. Deliberately WITHOUT
# `includeSubDomains` and WITHOUT `preload` even then: a host like this
# typically shares its institution's domain with unrelated services, and asserting
# a subdomain-wide or preload-list HTTPS policy from one lab workstation
# would affect hosts this deployment has no authority over.
add_header Strict-Transport-Security "max-age=300" always;
