# Response headers applied to both listeners.
#
# IMPORTANT nginx inheritance rule: `add_header` directives are inherited
# from an enclosing level ONLY when the current level declares no
# `add_header` of its own. Declaring even one add_header inside a nested
# location silently drops every inherited header for responses from that
# location. That is why nginx.conf includes this file again inside the
# nested /assets/ and =/index.html locations, which set their own
# Cache-Control -- without the re-include those responses would ship with
# no security headers at all. Do not "tidy" those duplicate includes away.
#
# `always` is set on each so the header is also emitted on error responses
# (403 from the CIDR allowlist, 502 while the api container is restarting),
# not only on 2xx/3xx.

# This app is never intended to be framed. DENY rather than SAMEORIGIN:
# nothing in the SPA embeds itself.
add_header X-Frame-Options "DENY" always;

# Stop browsers from MIME-sniffing a response into a different content
# type -- relevant here because GET /api/jobs/{id}/artifacts/{key} serves
# user-influenced files (cube files, logs, PNGs) from the app's own origin.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak the in-app URL (which carries thread and job ids) to any
# third-party origin a user might navigate to from a chat message.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS. Both listeners are HTTPS-only and the auth cookie is already
# Secure, so there is no HTTP listener to break. Deliberately WITHOUT
# `includeSubDomains` and WITHOUT `preload`: this host shares the
# campus.example.edu domain with unrelated institutional services, and
# asserting a subdomain-wide or preload-list HTTPS policy from one lab
# workstation would affect hosts this deployment has no authority over.
add_header Strict-Transport-Security "max-age=31536000" always;
