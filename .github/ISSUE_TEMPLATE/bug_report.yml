# Bug report form for the public repository.
#
# The `id` of each text field is also its query-string key, which is how the
# app prefills this form: frontend/src/lib/github.ts builds
# /issues/new?template=bug_report.yml&version=...&description=... from the
# Help panel, the bug-report flyout and the admin inbox. Rename an id here and
# rename it there, or the prefill silently stops landing in the field.
# Dropdowns and checkboxes cannot be prefilled by URL, which is why the
# version is a text input rather than a list.
name: Bug report
description: Something did not work the way the documentation says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A report that says what you asked for,
        what you expected and what you got instead is usually enough to
        reproduce. Screenshots help; attach them below. How a report is
        handled is described in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: input
    id: version
    attributes:
      label: NexusQC version
      description: Help → About in the app has it with a copy button. "unknown" is fine for a build you ran by hand.
      placeholder: v1.1.0 (0123456789ab)
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you asked the agent for, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows it, if you know one. Molecule, method, basis and engine if a job is involved.
      placeholder: |
        1. Ask for ...
        2. Approve the job
        3. ...
    validations:
      required: false
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: Which quantum chemistry program the job ran on, if the report is about a job.
      options:
        - Not about a job
        - PySCF
        - ORCA
        - BAGEL
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Anything relevant from the job's output files or the api container log. Pasted text is searchable; screenshots of text are not.
      render: shell
    validations:
      required: false
