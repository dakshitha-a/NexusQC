# Deployment stack for the CASSCF agent. See CLAUDE.md's "Deployment
# architecture" notes and the plan this was scaffolded from for the full
# design rationale -- summary of what's deliberately NOT here:
#
#  - No Celery/worker container. Job execution stays exactly the existing
#    subprocess-based JobManager (app/chemistry/jobs/base.py) running inside
#    `api`. JobManager and job_watcher are both hard singletons (orphan
#    reconciliation and duplicate-retry-notice prevention both assume
#    exactly one live instance ever) -- `api` must never be scaled beyond
#    replicas: 1.
#  - `vllm` is commented out by default. Chat inference can keep pointing at
#    the host's existing Ollama install (QC_AGENT_LLM_BASE_URL) until vLLM's
#    tool-calling/reasoning-parser behavior has been verified end-to-end
#    against this app's real multi-tool-call traffic (see the plan's Phase 0
#    spike). Uncomment when ready; QC_AGENT_LLM_GPU_IDS controls which of
#    this (possibly shared, multi-tenant) host's GPUs it claims -- never
#    defaults to "all of them."
#  - ORCA/BAGEL are NOT baked into the `api` image (ORCA's license forbids
#    redistribution) -- both are bind-mounted from the host below. Update
#    the source paths for your own lab's install locations.
#  - Postgres holds identity/ownership/admin data (users, sessions, invite
#    tokens, per-job/thread ownership index, audit log) AND, since the
#    checkpointer swap landed, every conversation's full chat history --
#    app/agent/graph.py switches from SqliteSaver to PostgresSaver the
#    moment QC_AGENT_DATABASE_URL is set, so the `checkpoints`,
#    `checkpoint_blobs` and `checkpoint_writes` tables live here too.
#    (An earlier version of this comment said chat content was NOT in
#    Postgres. That was written before the swap and is no longer true;
#    server/admin_cli.py's reset-all truncates those three tables for
#    exactly this reason.) Job artifacts and the KB remain on disk under
#    data/. Consequence for backups: a dump must cover the WHOLE database,
#    not just the auth tables -- see scripts/backup.sh.
#
# Losing this database is not merely "everyone re-registers": it drops
# ownership_index, and app/auth/ownership.py treats an unowned resource as
# accessible to everyone, so every pre-existing job would become globally
# readable. That is what makes scripts/backup.sh non-optional.

# Container log rotation. Docker's default json-file driver keeps logs
# UNBOUNDED -- on a long-running deployment the api container's uvicorn
# access log alone will eventually fill the disk that /var/lib/docker sits
# on (here that is `/`, at 76% with ~415G free, NOT the roomy /data
# volume). The usual fix is a daemon-wide default in /etc/docker/daemon.json,
# which is deliberately NOT used here: that needs root and a Docker daemon
# restart, and this host is genuinely shared -- a daemon restart would bounce
# another tenant's long-running container. Per-service `logging:` options are
# applied at container-create time instead, so they need no root and touch
# nothing outside this project's own services.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${QC_AGENT_POSTGRES_DB:-qc_agent}
      POSTGRES_USER: ${QC_AGENT_POSTGRES_USER:-qc_agent}
      POSTGRES_PASSWORD: ${QC_AGENT_POSTGRES_PASSWORD:?set QC_AGENT_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QC_AGENT_POSTGRES_USER:-qc_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      # F-004: build the image's runtime user with the HOST operator's own
      # uid/gid, so everything written into the bind-mounted ./data stays
      # owned by whoever runs the stack rather than by root. Set APP_UID /
      # APP_GID in the environment (or a .env file next to this one) when
      # the operator is not uid 1000:
      #
      #     APP_UID=$(id -u) APP_GID=$(id -g) docker compose build api
      #
      # A wrong value here is not silent: the api container fails to write
      # its own data directory at startup rather than quietly reintroducing
      # root-owned files.
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        # Optional extras, off by default -- see requirements-optional.txt.
        # 1 adds block2 (the DMRG entropy-pilot backend, 379 MB). Without it
        # the app simply stops offering entropy_method="dmrg" rather than
        # failing on it, so the default image is fully functional.
        INSTALL_DMRG: ${QC_AGENT_INSTALL_DMRG:-0}
    restart: unless-stopped
    logging: *default-logging
    # Readiness gate for nginx's own `depends_on` below. Deliberately NOT a
    # curl/wget check: this image is python:3.11-slim-bookworm plus only
    # build-essential/libgomp1/openmpi-bin, and has neither binary -- a
    # curl-based test would fail every time, leave the container
    # permanently `unhealthy`, and (because nginx waits on
    # service_healthy) mean nginx never starts at all. Python is
    # guaranteed present, so the check uses it directly.
    #
    # start_period is generous on purpose: importing app.agent.graph alone
    # measures ~3s cold on this host (CLAUDE.md's own note on the SEC-07
    # window measurement), on top of PostgresSaver.setup()'s first-run
    # checkpoint-table creation and the job_watcher/scan_orchestrator
    # startup. Failures during start_period do not count against retries.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Exactly one instance, always -- see the top-of-file note. Do not add
    # `deploy.replicas` or run a second `docker compose up --scale api=2`.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      QC_AGENT_SERVER_HOST: "0.0.0.0"
      QC_AGENT_SERVER_PORT: "8000"
      QC_AGENT_DATABASE_URL: postgresql://${QC_AGENT_POSTGRES_USER:-qc_agent}:${QC_AGENT_POSTGRES_PASSWORD:?}@postgres:5432/${QC_AGENT_POSTGRES_DB:-qc_agent}
      QC_AGENT_REDIS_URL: redis://redis:6379/0
      QC_AGENT_JWT_SECRET: ${QC_AGENT_JWT_SECRET:?set QC_AGENT_JWT_SECRET in .env}
      # Empty on purpose in the deployed stack. app/config.py defaults this
      # to "http://localhost:5173,http://127.0.0.1:5173" for the Vite dev
      # workflow, and AccessControlMiddleware checks that static allowlist
      # BEFORE falling back to reconstructing this deployment's own origin
      # from the forwarded Host/X-Forwarded-Proto headers. Leaving the dev
      # entries in would therefore let any state-changing request bearing
      # `Origin: http://localhost:5173` through the CSRF check -- on a
      # genuinely multi-tenant host where another user can bind a localhost
      # port, that is a real hole rather than a theoretical one. The
      # deployed stack needs no static entry at all: nginx serves the SPA
      # and /api/* from one origin, so every legitimate request is
      # same-origin and the dynamic fallback covers it.
      QC_AGENT_SERVER_CORS_ORIGINS: ""
      # Embeddings stay on the host's existing Ollama (native /api/embeddings,
      # not OpenAI-compatible -- a vLLM swap for chat does not cover this).
      QC_AGENT_OLLAMA_HOST: http://host.docker.internal:11434
      # Chat inference: points at host Ollama until the vllm service below
      # is uncommented and verified; then repoint at http://vllm:8000/v1
      # with zero code changes (this is the whole point of the existing
      # OpenAI-compatible LLM_BASE_URL abstraction in app/config.py).
      QC_AGENT_LLM_BASE_URL: ${QC_AGENT_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      QC_AGENT_LLM_MODEL: ${QC_AGENT_LLM_MODEL:-qwen3.8:27b}
      # ORCA and BAGEL are separately licensed and are NOT part of this
      # project -- no path to them is configured here, so a plain
      # `docker compose up` brings up a working PySCF-only stack on any
      # machine. A site that has them installed enables them by copying
      # docker-compose.override.yml.example to docker-compose.override.yml
      # (gitignored, auto-loaded by compose) and filling in its own paths.
      # This is deliberately an override file rather than an env var: the
      # bind mounts have to point at directories that actually exist, and a
      # missing mount source fails `compose up` outright.
      # Cores a SINGLE ORCA/BAGEL job requests, and the number of logical
      # cores JobManager waits to find idle before admitting one. NOT a
      # budget for the app as a whole: with QC_AGENT_MAX_CONCURRENT_JOBS
      # jobs in flight the app may use this many times that many cores,
      # which is intended -- the whole machine is available, and the
      # host-load admission gate is what keeps it from being swamped.
      #
      # Raise it for wide single jobs on a big machine; lower it to favour
      # many small jobs. Setting it near the machine's total core count
      # means a job only starts when nearly every core is simultaneously
      # idle, which on a busy host never happens -- jobs then sit at
      # "pending" indefinitely with no error to explain it.
      QC_AGENT_N_CORES: ${QC_AGENT_N_CORES:-4}
      QC_AGENT_MAX_CONCURRENT_JOBS: ${QC_AGENT_MAX_CONCURRENT_JOBS:-20}
    volumes:
      - ./data:/app/data
      # Licensed QC software (ORCA/BAGEL) and Intel oneAPI are mounted
      # read-only and are never baked into the image -- ORCA's license
      # forbids redistribution. See docker-compose.override.yml.example.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  # vllm:
  #   image: vllm/vllm-openai:v0.24.0  # pin a version at/after the
  #                                    # reasoning-parser/tool-call-parser
  #                                    # interaction fix -- verify against
  #                                    # the actually-available release tags
  #                                    # before deploying, don't trust this
  #                                    # tag literally.
  #   restart: unless-stopped
  #   runtime: nvidia
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: ${QC_AGENT_LLM_GPU_IDS:-0}
  #   command: >
  #     --model ${QC_AGENT_VLLM_MODEL:?set to a real FP8/AWQ Qwen3-30B checkpoint}
  #     --served-model-name qwen3-30b
  #     --tensor-parallel-size ${QC_AGENT_LLM_TP_SIZE:-1}
  #     --gpu-memory-utilization ${QC_AGENT_VLLM_GPU_MEM_UTIL:-0.65}
  #     --max-model-len ${QC_AGENT_VLLM_MAX_MODEL_LEN:-32768}
  #     --enable-auto-tool-choice
  #     --tool-call-parser hermes
  #     --reasoning-parser qwen3
  #   expose:
  #     - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # Wait for the api container to pass its own healthcheck, not merely
      # to be created. Without the condition, nginx would start while the
      # api process was still importing app.agent.graph and every request
      # in that window returned 502 -- worst on a reboot, when the whole
      # stack comes up at once and a user reloading the page sees a bare
      # gateway error rather than the app.
      api:
        condition: service_healthy
    volumes:
      # Individual file mounts, not the whole ./nginx dir onto /etc/nginx --
      # that would shadow the base image's own /etc/nginx/mime.types (still
      # `include`d by nginx.conf) and break content-type serving entirely.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./nginx/tls_common.conf:/etc/nginx/tls_common.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      # TWO explicit bind addresses, never 0.0.0.0. A host like this typically
      # has several routable addresses -- an internal LAN address, a tailnet
      # address, and often an institution-routable public one -- and binding
      # 0.0.0.0 would publish the listener on
      # all three, leaving nginx's CIDR allowlist as the only thing between
      # the open internet and this app. Naming the two intended interfaces
      # explicitly means the public address is never bound at all, so a
      # mistake in the allowlist cannot expose it. The allowlist in
      # nginx/nginx.conf stays as defence in depth, not as the only gate.
      #
      # Boot-order note: the tailnet bind depends on tailscaled having
      # brought tailscale0 up. tailscaled is enabled at boot, but if Docker
      # wins the race this container fails to bind and exits; `restart:
      # unless-stopped` then retries until the interface exists, so this
      # self-heals rather than needing a systemd ordering unit (which would
      # need root to install on this shared host).
      - "${QC_AGENT_LAN_BIND:?set QC_AGENT_LAN_BIND in .env}:8443:8443"
      - "${QC_AGENT_TAILSCALE_BIND:?set QC_AGENT_TAILSCALE_BIND in .env}:8443:8443"
      # Loopback, for host-local use only -- never reachable off this
      # machine, so it widens nothing. Added after the two binds above were
      # found to have silently removed host-local access: the operational
      # smoke checks in docs/DEPLOYMENT.md and the whole tests/ suite
      # (fixtures.py defaults QC_AGENT_TEST_BASE_URL to
      # https://127.0.0.1:8443) all address the app over loopback, and every
      # one of them broke. Without this, host-local checks need --resolve
      # gymnastics to reach an interface address instead.
      - "127.0.0.1:8443:8443"
      # Public listener -- deliberately NOT started. Enabling it is an
      # institutional decision, not a technical one. Two things must be
      # understood before uncommenting:
      #   1. nginx/nginx.conf's public server block has no CIDR allowlist
      #      at all, by design -- auth becomes the only gate.
      #   2. scripts/toggle_public_access.sh, described in its own header as
      #      the "real kill switch", DOES NOT WORK against a port published
      #      this way. It inserts a DROP into iptables INPUT, but traffic to
      #      a published container port is DNAT'd by Docker and traverses
      #      FORWARD/DOCKER-USER, never INPUT -- so the rule matches nothing
      #      and the switch silently does nothing. The working host-level
      #      equivalent is a rule in the DOCKER-USER chain instead; the
      #      app-level toggle (POST /api/admin/toggle-public-access) is
      #      unaffected and does work. See docs/DEPLOYMENT.md.
      # - "443:443"

volumes:
  postgres-data:
  redis-data:
