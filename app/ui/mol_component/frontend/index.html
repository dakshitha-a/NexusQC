<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: "Source Sans Pro", sans-serif; font-size: 14px; color: #262730; }
  #root { padding: 4px 0 8px 0; }
  #viewerContainer { width: 100%; border: 1px solid #ddd; border-radius: 4px; position: relative; }
  #readout {
    margin-top: 6px; padding: 6px 10px; background: #f0f2f6; border-radius: 4px;
    min-height: 18px; font-size: 13px;
  }
</style>
</head>
<body>
<div id="root">
  <div id="viewerContainer"></div>
  <div id="readout">Click an atom to select it (up to 4). Click empty space to reset.</div>
</div>

<script>
/* ---------------------------------------------------------------------
 * Streamlit custom-component postMessage protocol -- validated by hand
 * against a minimal test harness before writing this file. No React/npm
 * build; this is the whole frontend.
 * ------------------------------------------------------------------- */
function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
let _lastSentHeight = -1;
function setFrameHeight() {
  // Guarded against resending an unchanged (or near-unchanged) height:
  // Streamlit's own frontend re-renders this component's wrapper whenever
  // the iframe's reported height changes, which re-triggers a
  // streamlit:render post into this iframe -- calling setFrameHeight
  // unconditionally on every rebuild (which itself runs inside a
  // streamlit:render handler) created a tight resize<->render feedback
  // loop (~4 renders/sec, confirmed via console logging) that starved
  // click handling. Only report height when it moved by more than a
  // trivial sub-pixel amount.
  const h = document.documentElement.scrollHeight + 4;
  if (Math.abs(h - _lastSentHeight) < 3) return;
  _lastSentHeight = h;
  sendToStreamlit("streamlit:setFrameHeight", { height: h });
}

/* ---------------------------------------------------------------------
 * Geometry -- ported from app/chemistry/zmatrix.py's _distance/_angle_deg/
 * _dihedral_deg (same formulas, same IUPAC dihedral sign convention), so
 * the numbers shown here match to_zmatrix_block()'s.
 * ------------------------------------------------------------------- */
function sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function norm(v) { return Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]); }
function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function unit(v) { const n = norm(v); return n < 1e-8 ? v : [v[0]/n, v[1]/n, v[2]/n]; }

function distance(a, b) { return norm(sub(a, b)); }

function angleDeg(a, b, c) {
  const v1 = sub(a, b), v2 = sub(c, b);
  const n1 = norm(v1), n2 = norm(v2);
  if (n1 < 1e-8 || n2 < 1e-8) return 0.0;
  let cosT = dot(v1, v2) / (n1 * n2);
  cosT = Math.max(-1.0, Math.min(1.0, cosT));
  return Math.acos(cosT) * 180.0 / Math.PI;
}

function dihedralDeg(a, b, c, d) {
  const b1 = sub(b, a), b2 = sub(c, b), b3 = sub(d, c);
  const n1 = cross(b1, b2), n2 = cross(b2, b3);
  const n1n = norm(n1), n2n = norm(n2);
  if (n1n < 1e-8 || n2n < 1e-8) return 0.0;
  const n1u = unit(n1), n2u = unit(n2), b2u = unit(b2);
  const m1 = cross(n1u, b2u);
  const x = dot(n1u, n2u), y = dot(m1, n2u);
  return Math.atan2(y, x) * 180.0 / Math.PI;
}

/* ---------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------- */
let atoms = [];                 // [{elem, x, y, z}]  0-based order = display index
let selected = [];               // 0-based indices, up to 4, in click order
let viewer = null;
let firstRender = true;
let atomJustHandled = false;

function buildXyzBlock() {
  const lines = [String(atoms.length), "molecule"];
  for (const a of atoms) lines.push(a.elem + " " + a.x.toFixed(8) + " " + a.y.toFixed(8) + " " + a.z.toFixed(8));
  return lines.join("\n");
}

/* ---------------------------------------------------------------------
 * Rendering
 * ------------------------------------------------------------------- */
function updateReadout() {
  const el = document.getElementById("readout");
  if (selected.length === 0) {
    el.textContent = "Click an atom to select it (up to 4). Click empty space to reset.";
  } else if (selected.length === 1) {
    const i = selected[0];
    el.textContent = "Atom " + (i + 1) + ": " + atoms[i].elem;
  } else if (selected.length === 2) {
    const [i, j] = selected;
    const d = distance([atoms[i].x, atoms[i].y, atoms[i].z], [atoms[j].x, atoms[j].y, atoms[j].z]);
    el.textContent = "Bond length (" + (i+1) + "-" + (j+1) + "): " + d.toFixed(4) + " Å";
  } else if (selected.length === 3) {
    const [i, j, k] = selected;
    const a = angleDeg([atoms[i].x,atoms[i].y,atoms[i].z], [atoms[j].x,atoms[j].y,atoms[j].z], [atoms[k].x,atoms[k].y,atoms[k].z]);
    el.textContent = "Angle (" + (i+1) + "-" + (j+1) + "-" + (k+1) + "), vertex " + (j+1) + ": " + a.toFixed(2) + "°";
  } else if (selected.length === 4) {
    const [i, j, k, l] = selected;
    const dih = dihedralDeg(
      [atoms[i].x,atoms[i].y,atoms[i].z], [atoms[j].x,atoms[j].y,atoms[j].z],
      [atoms[k].x,atoms[k].y,atoms[k].z], [atoms[l].x,atoms[l].y,atoms[l].z]);
    el.textContent = "Dihedral (" + (i+1) + "-" + (j+1) + "-" + (k+1) + "-" + (l+1) + "): " + dih.toFixed(2) + "°";
  }
}

function applySelectionHighlight() {
  if (!viewer) return;
  applyBaseStyle();
  for (const idx of selected) {
    viewer.addStyle({ index: idx }, { sphere: { radius: 0.55, color: "#ffd21f" }, stick: {} });
  }
  viewer.render();
}

function baseStyle() {
  return { stick: {}, sphere: { scale: 0.25 } };
}
function applyBaseStyle() {
  viewer.setStyle({}, baseStyle());
}

function rebuildViewer() {
  if (!viewer) return;
  viewer.removeAllModels();
  viewer.removeAllLabels();
  viewer.removeAllShapes();
  if (atoms.length > 0) {
    viewer.addModel(buildXyzBlock(), "xyz");
    applyBaseStyle();
    // setClickable attaches to the atoms present in the model *at the time
    // it's called* (confirmed empirically -- calling it once before any
    // atoms existed left every subsequently-added atom unclickable), so it
    // has to be reapplied after every addModel.
    viewer.setClickable({}, true, function(atom) { onAtomClicked(atom); });
    atoms.forEach((a, i) => {
      viewer.addLabel(String(i + 1), {
        position: { x: a.x, y: a.y, z: a.z },
        backgroundColor: "white", backgroundOpacity: 0.6,
        fontColor: "black", fontSize: 11, borderThickness: 0,
        inFront: true, showBackground: true,
      });
    });
    for (const idx of selected) {
      viewer.addStyle({ index: idx }, { sphere: { radius: 0.55, color: "#ffd21f" }, stick: {} });
    }
    if (firstRender) { viewer.zoomTo(); firstRender = false; }
  }
  viewer.setBackgroundColor("0xeeeeee");
  viewer.render();
  updateReadout();
  setFrameHeight();
}

function resetSelection() {
  selected = [];
  applySelectionHighlight();
  updateReadout();
}

function toggleAtomSelection(idx) {
  const pos = selected.indexOf(idx);
  if (pos >= 0) {
    selected.splice(pos, 1);
  } else {
    if (selected.length >= 4) return;
    selected.push(idx);
  }
  applySelectionHighlight();
  updateReadout();
}

/* ---------------------------------------------------------------------
 * Click handling: 3Dmol's setClickable fires for atom clicks; a plain
 * listener on the container catches clicks that miss every atom (empty
 * space) since 3Dmol's own handler is attached to a child canvas and
 * therefore runs first during bubbling -- the deferred check below only
 * fires the "empty space" path if no atom-click ran in this tick.
 * ------------------------------------------------------------------- */
function onAtomClicked(atom) {
  atomJustHandled = true;
  const idx = atom.index;
  if (idx === undefined || idx === null || idx < 0 || idx >= atoms.length) return;
  toggleAtomSelection(idx);
}

function onContainerClick() {
  // 3Dmol's own atom-click callback (registered via setClickable) fires
  // asynchronously relative to the native DOM click event -- observed
  // empirically to lag by ~50ms, not run synchronously within it -- so
  // this can't be a same-tick "did an atom absorb this click" check. Defer
  // long enough for that callback to have run, and use a flag rather than
  // timestamp comparison so ordering between the two doesn't matter.
  setTimeout(() => {
    if (atomJustHandled) { atomJustHandled = false; return; }
    if (selected.length > 0) resetSelection();
  }, 180);
}

/* ---------------------------------------------------------------------
 * Init + Streamlit render events
 * ------------------------------------------------------------------- */
let _lastAppliedHeight = 320;
function initViewer() {
  const container = document.getElementById("viewerContainer");
  container.style.height = _lastAppliedHeight + "px";
  viewer = $3Dmol.createViewer(container, { backgroundColor: "0xeeeeee" });
  container.addEventListener("click", onContainerClick);
}

function loadMoleculeFromArgs(mol) {
  atoms = [];
  if (mol && mol.symbols && mol.symbols.length) {
    for (let i = 0; i < mol.symbols.length; i++) {
      const c = mol.coords[i];
      atoms.push({ elem: mol.symbols[i], x: c[0], y: c[1], z: c[2] });
    }
  }
  selected = [];
  firstRender = true;
}

let _lastArgsJSON = null;
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  // Streamlit's frontend re-posts streamlit:render on every one of its own
  // re-renders (observed: several times a second even with static args and
  // no user interaction) -- rebuilding the viewer from scratch each time
  // reset the 3Dmol clickable state mid-interaction. Skip entirely unless
  // the args actually changed.
  const argsJSON = JSON.stringify(args);
  if (argsJSON === _lastArgsJSON) return;
  _lastArgsJSON = argsJSON;
  const container = document.getElementById("viewerContainer");

  if (!viewer) initViewer();

  // 3Dmol sizes its canvas/camera to the container's dimensions *at the
  // time viewer.resize() is called* -- changing the container's CSS height
  // alone leaves 3Dmol's internal projection stuck at whatever size it was
  // last resized to, so modelToScreen() and the click-picking ray silently
  // disagree with the actual DOM layout. Confirmed by reproducing it with
  // mismatched heights and fixing it with the resize() call below.
  const requestedHeight = args.height || _lastAppliedHeight;
  if (requestedHeight !== _lastAppliedHeight) {
    _lastAppliedHeight = requestedHeight;
    container.style.height = requestedHeight + "px";
    viewer.resize();
  }

  // Always reload from whatever Python just sent -- this is read-only (no
  // local edit state to protect), so there's no reason to skip a reload,
  // and skipping one is actively wrong: two molecules that happen to hash
  // to the same component `key` (e.g. same SMILES, different geometry)
  // would otherwise keep showing stale atoms after the first load.
  loadMoleculeFromArgs(args.molecule);
  rebuildViewer();
});

document.addEventListener("DOMContentLoaded", () => {
  initViewer();
  rebuildViewer();
  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight();
});
</script>
</body>
</html>
